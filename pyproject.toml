[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "get-me-a-job"
version = "0.1.0"
description = "Local tool to find niche jobs, score fit against your profile and apply with less friction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "pypdf>=4",
  "platformdirs>=4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gmaj = "gmaj.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmaj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
